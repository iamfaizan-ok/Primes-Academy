[app]
# Replace with your existing Fly app name
name = "primes-academy"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
# Fly provides DATABASE_URL automatically; ensure Django reads it
DJANGO_SETTINGS_MODULE = "config.settings"
PYTHONUNBUFFERED = "1"

[processes]
  app = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"

[services]
  [[services.ports]]
    internal_port = 8080
    protocol = "tcp"
    handlers = ["http"]

  [[services.http_checks]]
    interval = "30s"
    grace_period = "5s"
    timeout = "5s"
    method = "GET"
    path = "/"

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"

